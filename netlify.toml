[build]
  publish = "."
  functions = "netlify/functions"

# 1. WhatsApp और सोशल बॉट्स के लिए (डायनामिक फोटो और नाम का प्रीव्यू)
[[redirects]]
  from = "/wish/:code"
  to = "/.netlify/functions/wish-preview/:code"
  status = 200
  conditions = {UserAgent = ["*WhatsApp*", "*facebookexternalhit*", "*Twitterbot*", "*LinkedInBot*", "*TelegramBot*", "*SkypeUriPreview*"]}

# 2. सामान्य यूज़र जब लिंक खोले (404 एरर रोकने के लिए)
[[redirects]]
  from = "/wish/:code"
  to = "/index.html?w=:code"
  status = 200

# 3. SPA Fallback ताकि कोई भी पेज 404 न दिखाए
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
